<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="幕末の十の学び舎を、歩いてめぐる追体験アプリ">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>幕末まなび旅</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Antique&family=Klee+One:wght@400;600&display=swap">
<style>
/* layout: 浮世絵の道中図 → 学び舎ごとに空気(光・床・色)が切り替わる一画面の舞台。単一テーマ(和紙)を意図して採用 */
:root{
  color-scheme:light;
  --washi:#e8e1cf; --washi-2:#d9d0b8; --sumi:#1c1a17; --usuzumi:#5d574c;
  --ai:#1f3a5c; --shu:#c0391f; --matsu:#3f5b46; --kaki:#8f5527;
  --bg:var(--washi); --fg:var(--sumi); --panel:#f1ecdd; --panel-fg:var(--sumi); --line:#b9ae93;
  --f-brush:"Dela Gothic One","Hiragino Kaku Gothic StdN","Yu Gothic",sans-serif;
  --f-book:"Zen Antique","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Klee One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
}
body[data-s="nisshin"]{--bg:#cfd3d1;--fg:#1b1e22;--line:#9aa3a3}
body[data-s="teki"]{--bg:#12141a;--fg:#e9dfc6;--panel:#231f1a;--panel-fg:#efe4c8;--line:#4a4032}
body[data-s="shoka"]{--bg:#d6cf9f;--fg:#231d12;--panel:#f3ecd2;--line:#a89d6a}
*{box-sizing:border-box}
html,body{min-height:100%}
html{background:#14233a}
body{background:#14233a radial-gradient(circle at 50% 100%,transparent 9px,#1d3352 10px 11px,transparent 12px 16px,#1d3352 17px 18px,transparent 19px) 0 0/40px 20px;color:var(--fg);font-family:var(--f-body);font-weight:600;font-size:17px;line-height:1.9}
#app{max-width:520px;min-height:100dvh;margin:0 auto;padding-inline:16px;padding-block:20px 56px;display:flex;flex-direction:column;gap:20px;background:var(--bg);color:var(--fg);box-shadow:0 0 70px #000a;transition:background .6s,color .6s;overflow-x:clip}
ruby rt{font-size:.5em;letter-spacing:0;font-family:var(--f-body);font-weight:500}
h1,h2,h3{font-family:var(--f-brush);font-weight:400;margin:0;line-height:1.5;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--shu);outline-offset:3px}

/* 道中図 */
.sky{margin:-20px -16px 0;padding:36px 16px 44px;background:linear-gradient(#17304f 0,#2d5078 34%,#8fa9b5 70%,var(--washi) 100%);color:#f3ecd9;text-align:center;position:relative}
.sky h1{font-size:clamp(40px,11vw,64px);letter-spacing:.08em}
.sky p{font-size:15px;opacity:.95}
.sky .sun{position:absolute;right:9%;top:26px;width:46px;height:46px;border-radius:50%;background:var(--shu);opacity:.9}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:14px;align-items:center}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:0 8px;line-height:1.8;border:1.5px solid currentColor;margin-right:6px;vertical-align:middle;white-space:nowrap}
.chip.f{color:var(--ai)} .chip.a{color:var(--kaki);border-style:dashed}
body[data-s="teki"] .chip.f{color:#9db9dc} body[data-s="teki"] .chip.a{color:#d9a56a}
.road{list-style:none;margin:0;padding:0 0 0 26px;border-left:3px dotted var(--usuzumi);display:flex;flex-direction:column;gap:14px}
.road li{position:relative}
.road li::before{content:"";position:absolute;left:-35px;top:22px;width:15px;height:15px;border-radius:50%;background:var(--washi);border:3px solid var(--sumi)}
.road li.done::before{background:var(--shu);border-color:var(--shu)}
.fuda{width:100%;text-align:left;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:12px 16px;background:var(--panel);border:1.5px solid var(--sumi);border-radius:3px;box-shadow:3px 3px 0 var(--washi-2)}
.fuda .no{font-family:var(--f-brush);font-size:28px;color:var(--ai);width:1.3em;text-align:center}
.fuda .nm{font-family:var(--f-brush);font-size:24px;line-height:1.6}
.fuda .sub{font-size:13px;color:var(--usuzumi);line-height:1.5}
.fuda .go{font-size:13px;font-weight:700;background:var(--sumi);color:var(--washi);padding:2px 10px;border-radius:2px;white-space:nowrap}
.fuda[disabled]{opacity:.55;cursor:default;box-shadow:none;border-style:dashed}
.fuda[disabled] .go{background:none;color:var(--usuzumi)}
button.fuda:not([disabled]):hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--washi-2)}
.seal{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;border:3px solid var(--shu);color:var(--shu);font-family:var(--f-brush);font-size:24px;transform:rotate(-8deg)}

/* 舞台 */
.scene{position:relative;height:200px;margin:-20px -16px 0;overflow:hidden}
.scene .name{position:absolute;right:20px;top:16px;writing-mode:vertical-rl;font-family:var(--f-brush);font-size:34px;letter-spacing:.12em;line-height:1.2;z-index:3}
.scene .where{position:absolute;left:16px;bottom:10px;font-size:13px;z-index:3;font-weight:700}
/* 日新館: 雪の朝・しっくい壁・板の間 */
.sc-nisshin{background:linear-gradient(#e6e8e4 0 62%,#6f5236 62% 64%,#8a6a47 64%)}
.sc-nisshin::after{content:"";position:absolute;inset:64% 0 0;background:repeating-linear-gradient(90deg,transparent 0 78px,#5e4429 78px 80px)}
.sc-nisshin .win{position:absolute;left:8%;top:18px;width:46%;max-width:260px;height:96px;border:5px solid #4a3622;background:#b9c6cf;overflow:hidden}
.sc-nisshin .win::before{content:"";position:absolute;inset:-100px 0 0;background-image:radial-gradient(#fff 1.6px,transparent 2px),radial-gradient(#fff 1.2px,transparent 1.6px);background-size:38px 46px,27px 33px;animation:snow 7s linear infinite}
.sc-nisshin .win::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 30px,#4a3622 30px 33px)}
@keyframes snow{to{transform:translateY(92px)}}
/* 適塾: 夜・行灯・格子 */
.sc-teki{background:#0d0f14;color:#e9dfc6}
.sc-teki::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 24% 62%,#e8a54a66 0,#b8601f33 22%,transparent 52%);animation:flick 2.6s ease-in-out infinite}
.sc-teki .lamp{position:absolute;left:calc(24% - 22px);top:78px;width:44px;height:64px;background:linear-gradient(#f6d89a,#e9a850);border:3px solid #2a1c10;box-shadow:0 0 40px #f2b25e}
.sc-teki .lamp::after{content:"";position:absolute;left:-9px;right:-9px;bottom:-16px;height:13px;background:#2a1c10}
.sc-teki .kou{position:absolute;right:92px;left:46%;top:20px;height:112px;background:repeating-linear-gradient(90deg,#2b2318 0 7px,#141a2a 7px 20px);border:4px solid #2b2318}
.sc-teki::after{content:"";position:absolute;inset:78% 0 0;background:repeating-linear-gradient(90deg,#3b3a22 0 3px,#33321d 3px 6px)}
@keyframes flick{0%,100%{opacity:1}43%{opacity:.82}50%{opacity:.95}71%{opacity:.76}}
/* 松下村塾: 昼下がり・障子・八畳 */
.sc-shoka{background:linear-gradient(#efe6c4 0 66%,#b9ac6a 66%)}
.sc-shoka .shoji{position:absolute;left:6%;top:14px;width:50%;max-width:280px;height:112px;background:#fbf6e2;border:5px solid #6b4a2a;background-image:linear-gradient(#6b4a2a 2px,transparent 2px),linear-gradient(90deg,#6b4a2a 2px,transparent 2px);background-size:100% 37px,46px 100%;box-shadow:0 0 50px #fff6c8}
.sc-shoka::before{content:"";position:absolute;inset:0;background:linear-gradient(112deg,transparent 30%,#fff8cf88 31% 46%,transparent 47%);z-index:1}
.sc-shoka::after{content:"";position:absolute;inset:66% 0 0;background:repeating-linear-gradient(90deg,transparent 0 118px,#5c5a2c 118px 121px)}

/* 追加七校の舞台 */
body[data-s="kodo"]{--bg:#eadfd6} body[data-s="shohei"]{--bg:#c6ccc4} body[data-s="fuku"]{--bg:#d3d6d2}
body[data-s="shizu"]{--bg:#d8d6bd} body[data-s="kangi"]{--bg:#cfd3c2} body[data-s="kaigun"]{--bg:#c2d5db} body[data-s="goju"]{--bg:#dcd2c0}
.scene .name{max-height:176px}
.roof{position:absolute;left:6%;bottom:28%;width:54%;max-width:300px;height:100px;clip-path:polygon(8% 0,92% 0,100% 40%,95% 40%,95% 100%,5% 100%,5% 40%,0 40%)}
.sc-kodo{background:linear-gradient(#f6e9e6 0 72%,#cdc3a8 72%)}
.sc-kodo .roof{background:linear-gradient(#2c2c2c 0 40%,#f5f2e9 40%)}
.sc-kodo .ume{position:absolute;right:70px;top:0;width:44%;height:120px;background-image:radial-gradient(#cf3f6b 3.5px,transparent 4.5px),radial-gradient(#fff 3px,transparent 4px),linear-gradient(160deg,transparent 48%,#3a2a22 48% 51%,transparent 51%);background-size:44px 36px,58px 50px,100% 100%}
.sc-shohei{background:linear-gradient(#b7c3c8 0 72%,#8b8878 72%)}
.sc-shohei .roof{background:linear-gradient(#4b7a66 0 40%,#191919 40%)}
.sc-fuku{background:linear-gradient(#d3dde0 0 58%,#5f8496 58% 72%,#b5a787 72%)}
.sc-fuku .roof{background:linear-gradient(#3b3b3b 0 40%,#ece5d3 40%)}
.sc-shizu{background:linear-gradient(#e2e8d8 0 26%,#58774c 26% 72%,#b9ae8c 72%)}
.sc-shizu .roof{background:linear-gradient(#a8522c 0 46%,#eadcc3 46%)}
.sc-kangi{background:linear-gradient(#e9ece2 0 40%,#a9b8a4 40% 72%,#b3a985 72%)}
.sc-kangi .roof{background:linear-gradient(#8b7a48 0 52%,#e7ddc3 52%);clip-path:polygon(20% 0,80% 0,100% 52%,94% 52%,94% 100%,6% 100%,6% 52%,0 52%)}
.sc-kaigun{background:linear-gradient(#d4e3e8 0 58%,#2e5f7b 58%)}
.sc-kaigun .ship{position:absolute;left:12%;bottom:32%;width:48%;max-width:270px;height:112px;animation:bob 4s ease-in-out infinite;background:linear-gradient(90deg,transparent 22%,#1c1a17 22% 24%,transparent 24% 49%,#1c1a17 49% 51%,transparent 51% 76%,#1c1a17 76% 78%,transparent 78%) top/100% 82px no-repeat}
.sc-kaigun .ship::after{content:"";position:absolute;left:0;right:0;bottom:0;height:30px;background:#1c1a17;clip-path:polygon(0 0,100% 0,90% 100%,8% 100%)}
@keyframes bob{50%{transform:translateY(5px) rotate(-1deg)}}
.sc-goju{background:linear-gradient(#efe3d2 0 60%,#3d6a82 60% 74%,#b8ac8c 74%)}
.sc-goju .yama{position:absolute;left:4%;bottom:38%;width:62%;max-width:340px;height:92px;background:#4b5563;clip-path:polygon(0 100%,24% 34%,36% 22%,44% 30%,56% 8%,66% 14%,100% 100%)}
.sc-goju .kemuri{position:absolute;left:32%;top:8px;width:70px;height:44px;border-radius:50%;background:#9a9591;opacity:.75;filter:blur(5px)}
.mato{position:relative;height:44px;background:var(--bg);border:1.5px solid var(--fg)}
.mato::before{content:"";position:absolute;left:41%;width:18%;top:0;bottom:0;background:var(--shu);opacity:.8}
.mato .ya{position:absolute;top:5px;width:6px;height:32px;background:var(--fg);animation:ya 1.2s linear infinite alternate!important}
@keyframes ya{from{left:0}to{left:calc(100% - 6px)}}
.yuka{height:96px;background:#3a1c13;position:relative;overflow:hidden;border:1.5px solid var(--line)}
.yuka i{position:absolute;inset:0;background:linear-gradient(100deg,transparent 22%,#fff9 40%,#ffe9b0aa 48%,transparent 66%);opacity:0;transition:opacity .4s}
.datsu{display:grid;gap:10px}
.datsu button{text-align:left;padding:10px 14px;background:var(--bg);border:1.5px solid var(--fg);border-radius:3px;color:var(--fg)}
.datsu button[disabled]{text-decoration:line-through;opacity:.45}
.kyu{font-family:var(--f-brush);font-size:20px}
.kyu b{color:var(--shu);font-weight:400;font-size:1.3em}
.eng{font-family:Georgia,"Times New Roman",serif;font-size:34px;line-height:1.3}
.panel{background:var(--panel);color:var(--panel-fg);border:1.5px solid var(--line);padding:20px 18px;display:flex;flex-direction:column;gap:14px;border-radius:3px}
.panel h2{font-size:26px}
.note{font-size:14px;line-height:1.75;border-top:1px dashed var(--line);padding-top:10px}
.tate{writing-mode:vertical-rl;font-family:var(--f-book);font-weight:700;font-size:clamp(21px,5.6vw,27px);line-height:2.3;letter-spacing:.08em;height:15em;max-width:100%;overflow-x:auto;margin-inline:auto;padding:8px 4px}
.tate span{transition:color .3s,opacity .3s;opacity:.28}
.tate span.on{opacity:1}
.tate span.now{color:var(--shu)}
.tate.all span{opacity:1}
.btn{background:var(--sumi);color:var(--washi);border:0;padding:10px 22px;border-radius:3px;font-weight:700;font-size:17px;align-self:flex-start}
body[data-s="teki"] .btn{background:#e9dfc6;color:#12141a}
.btn.sub{background:none;color:inherit;border:1.5px solid currentColor}
body[data-s="teki"] .btn.sub{background:none;color:inherit}
.btn[disabled]{opacity:.35;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.dots{display:flex;gap:7px}
.dots i{width:10px;height:10px;border-radius:50%;border:1.5px solid currentColor;opacity:.6}
.dots i.on{background:currentColor;opacity:1}
.ans{min-height:58px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end;padding-bottom:6px;font-family:var(--f-book);font-weight:700;font-size:20px}
.tiles{display:flex;flex-wrap:wrap;gap:10px}
.tile{font-family:var(--f-book);font-weight:700;font-size:20px;line-height:2;padding:4px 14px;background:var(--bg);color:var(--fg);border:1.5px solid var(--fg);border-radius:3px}
.tile.used{visibility:hidden}
.tile.ng{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.okite{font-family:var(--f-book);font-weight:700;font-size:clamp(18px,4.8vw,22px);line-height:2.2;margin:0;padding:0;list-style:none;min-height:9em}
.okite li{animation:rise .5s}
.okite .last{font-family:var(--f-brush);font-size:1.25em;color:var(--shu);margin-top:6px}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.nl{display:flex;flex-wrap:wrap;gap:10px;font-family:Georgia,"Times New Roman",serif;font-size:24px}
.nl button{background:none;border:0;border-bottom:2px dotted currentColor;padding:2px 4px;display:flex;flex-direction:column;align-items:center;line-height:1.4}
.nl small{font-family:var(--f-body);font-size:12px;min-height:1.6em;color:#e0b070}
.wait{height:8px;background:var(--line);overflow:hidden}
.wait b{display:block;height:100%;width:0;background:#e8a54a}
.marks{font-size:30px;letter-spacing:.3em;font-family:var(--f-book)}
.usu{display:grid;place-items:center;gap:8px}
.kine{width:26px;height:110px;background:#7a5633;border-radius:6px 6px 12px 12px;transform-origin:50% 0;transition:transform .12s}
.kine.hit{transform:translateY(26px)}
.mortar{width:130px;height:54px;background:#5a4630;border-radius:8px 8px 40px 40px;border-top:10px solid #efe9d6}
.plan{width:150px;max-width:100%}
.plan rect{fill:#c9c07a;stroke:#4f4a22;stroke-width:2}
.choice{display:grid;gap:10px}
.choice button{text-align:left;padding:10px 14px;background:var(--bg);border:1.5px solid var(--fg);border-radius:3px;color:var(--fg)}
.choice button.sel{background:var(--fg);color:var(--bg)}
textarea{font:inherit;width:100%;min-height:92px;padding:10px;background:#fffdf3;color:#1c1a17;border:1.5px solid var(--line);border-radius:3px;resize:vertical}
.voices{display:grid;gap:8px;font-size:15px}
.voices p{border-left:4px solid var(--matsu);padding-left:10px}
.tegata{align-self:center;width:min(100%,380px);background:linear-gradient(90deg,#b98a54,#c99b63 40%,#b58449);color:#231708;border-radius:46px 46px 6px 6px;padding:34px 22px 24px;text-align:center;display:flex;flex-direction:column;gap:14px;box-shadow:0 4px 0 #6f4d27;position:relative}
.tegata::before{content:"";position:absolute;top:12px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--washi)}
.tegata h2{font-size:34px;letter-spacing:.2em}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;justify-items:center}
.stamps .seal{width:46px;height:46px}
.stamps .none{border:2px dashed #7a5a34;color:transparent;transform:none}
.shi{font-family:var(--f-brush);font-size:20px;line-height:1.7;overflow-wrap:anywhere}
.big{font-family:var(--f-brush);font-size:30px;text-align:center}
.cv{width:100%;height:250px;display:block;border:1.5px solid var(--sumi);background:#efe6d0}
#go{touch-action:none;user-select:none;-webkit-user-select:none}
.nfuda{border:2px solid var(--panel-fg);padding:10px 14px;font-size:15px;line-height:1.8;background:var(--bg);color:var(--fg)}
.nfuda b.t{font-family:var(--f-brush);font-weight:400;font-size:20px;margin-right:8px}
.ima{color:var(--shu);font-weight:700;white-space:nowrap}
input[type=text]{font:inherit;width:100%;max-width:280px;padding:8px 10px;background:#fffdf3;color:#1c1a17;border:1.5px solid var(--line);border-radius:3px}
.choice small{display:block;font-size:13px;line-height:1.6;opacity:.85}
.ages{display:flex;flex-wrap:wrap;gap:8px}
.ages button{padding:4px 14px;background:var(--bg);border:1.5px solid var(--fg);border-radius:3px;color:var(--fg)}
.ages button.sel{background:var(--fg);color:var(--bg)}
.menjo{align-self:center;width:min(100%,460px);background:#f6f1e1;border:6px double var(--sumi);padding:24px 20px;text-align:center;display:flex;flex-direction:column;gap:10px}
.menjo h2{font-size:38px;letter-spacing:.25em}
details{font-size:14px;line-height:1.8}
details summary{cursor:pointer;font-weight:700}
/* 第四版: 書体・スマホ主体・扉絵・人物・音 */
h1,h2,.fuda .nm,.fuda .no,.big,.kyu,.seal,.shi,.okite .last{letter-spacing:.02em}
.tate,.tile,.ans,.okite,.marks{font-weight:400}
.panel h2{font-size:23px}.fuda .nm{font-size:20px}.fuda .no{font-size:24px}.big{font-size:26px}.kyu{font-size:17px}.shi{font-size:18px}
.btn{min-height:48px}.choice button,.datsu button,.tile{min-height:46px}
.nav{position:sticky;bottom:0;z-index:5;background:var(--bg);margin-inline:-16px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));border-top:1.5px solid var(--line)}
#back{align-self:flex-end}
#snd{position:fixed;z-index:20;top:calc(8px + env(safe-area-inset-top,0px));left:max(8px,calc(50% - 252px));min-height:38px;padding:0 12px;border:1.5px solid #e8e1cf;border-radius:19px;background:#1c1a17d9;color:#e8e1cf;font:600 13px var(--f-body)}
.art{position:absolute;inset:0;width:100%;height:100%}
.title{position:relative;margin:-20px -16px -56px;min-height:max(620px,100dvh);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:24px 20px calc(26px + env(safe-area-inset-bottom,0px));color:#f3ecd9}
.title h1{position:absolute;right:20px;top:40px;writing-mode:vertical-rl;font-size:clamp(34px,10vw,46px);letter-spacing:.06em;line-height:1.12;color:#fff;text-shadow:4px 4px 0 #14294a;animation:rise 1s both}
.title .lead{position:absolute;right:calc(34px + clamp(34px,10vw,46px));top:48px;writing-mode:vertical-rl;font-size:16px;letter-spacing:.24em;text-shadow:0 1px 6px #14294a;animation:rise 1s .4s both}
.tbox{position:relative;z-index:2;display:flex;flex-direction:column;gap:12px;background:#14294ae6;border:1.5px solid #e8e1cf;padding:16px;border-radius:4px;animation:rise .8s .7s both}
.tbox p{font-size:14px;line-height:1.7}
.tbox .btn{align-self:stretch;font-size:19px;background:var(--shu);color:#fff}
.tbox .btn.sub{background:none;color:#f3ecd9;font-size:16px}
.tseals{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.tseals .seal{width:30px;height:30px;font-size:15px;border-width:2px;opacity:.3;color:#f3ecd9;border-color:#f3ecd9;transform:none}
.tseals .seal.got{opacity:1;color:#ff8a70;border-color:#ff8a70}
.petal{position:absolute;top:-20px;width:11px;height:8px;background:#f4bcc6;border-radius:80% 10% 80% 10%;animation:fall linear infinite;z-index:1}
@keyframes fall{to{transform:translate(-70px,110vh) rotate(540deg)}}
.banner{position:relative;margin:-20px -16px 0;height:150px;overflow:hidden}
.banner h1{position:absolute;right:18px;bottom:10px;color:#fff;font-size:34px;text-shadow:3px 3px 0 #14294a}
.chara{display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:start}
.chara>div{min-width:0}
.chara svg{width:84px;height:84px;display:block}
.chara b{font-family:var(--f-brush);font-weight:400;font-size:17px;line-height:1.6;display:block}
.chara small{display:block;font-size:13px;line-height:1.5;opacity:.85}
.fuki{background:var(--bg);color:var(--fg);border:1.5px solid currentColor;border-radius:4px 14px 14px 14px;padding:8px 12px;margin-top:6px;font-size:16px;line-height:1.75}
.met{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px;text-align:center;font-size:12px;line-height:1.4;width:100%}
.met svg{width:62px;height:62px;margin:0 auto;display:block}
.met .q{opacity:.25}
.op{position:relative;margin:-20px -16px -56px;min-height:max(620px,100dvh);overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;gap:18px;padding:64px 22px calc(22px + env(safe-area-inset-bottom,0px));background:linear-gradient(#0f1d33,#1f3a5c 70%,#2d4f78);color:#f3ecd9}
.op svg.ship{width:100%;height:auto;display:block;border:1.5px solid #f3ecd955}
.optx{display:flex;flex-direction:column;gap:14px;font-size:19px;line-height:2.1}
.optx p{animation:rise 1s both}
.optx p.big{color:#fff;font-size:30px;text-align:left}
.opnav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.opnav span{font-size:13px;opacity:.7}
.opnav .btn{background:var(--shu);color:#fff}
.opnav .btn.sub{background:none;color:#f3ecd9}
.goalist{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:16px;line-height:1.7}
.goalist li{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:baseline;border-bottom:1px dashed currentColor;padding-bottom:6px}
.goalist b{font-family:var(--f-brush);font-weight:400;white-space:nowrap}
.goalist li.ok b{color:var(--shu)}
.op .goalist li.ok b{color:#ff8a70}
.goal{border-top:5px solid var(--shu)}
.srcb{border-top:1.5px solid var(--line);padding-top:10px;font-size:14px;line-height:1.75}
.srcb ul{margin:2px 0 8px;padding-left:1.3em}
.srcb .lk{font-size:13px;overflow-wrap:anywhere}
.srcb a{color:var(--ai)}
img.pt{border-radius:50%;border:2px solid #1c1a17;display:block;object-fit:cover}
.chara img.pt{width:84px;height:84px}
.met img.pt{width:62px;height:62px;margin:0 auto}
#tabs{position:fixed;z-index:15;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);display:grid;grid-template-columns:1fr 1fr;background:#1c1a17;padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs button{min-height:54px;background:none;border:0;border-top:4px solid transparent;color:#cfc7b3;font:600 15px var(--f-body)}
#tabs button.on{border-top-color:var(--shu);color:#fff;background:#2e2a24}
body.tabbed #app{padding-bottom:calc(86px + env(safe-area-inset-bottom,0px))}
body.tabbed .nav{bottom:calc(54px + env(safe-area-inset-bottom,0px))}
.evt{border:2px solid var(--shu);padding:12px;display:flex;flex-direction:column;gap:10px;animation:rise .6s}
.evt b.t{font-family:var(--f-brush);font-weight:400;color:var(--shu);font-size:17px}
.cal{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.cal i{aspect-ratio:1;border:1.5px solid var(--line);border-radius:50%}
.cal i.on{background:var(--shu);border-color:var(--shu)}
.panel h3{font-size:18px;margin-top:6px}
.rec{list-style:none;margin:0;padding:0;display:grid;gap:0}
.rec li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-top:1px dashed var(--line);font-size:15px;line-height:1.7}
.rec small{grid-column:1/-1;font-size:13px;opacity:.85}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>

<button id="snd" type="button" aria-pressed="true">♪ 音あり</button>
<div id="app"></div>
<nav id="tabs" hidden aria-label="画面の切りかえ"><button type="button" data-v="map">道中図</button><button type="button" data-v="pass">マイページ</button></nav>

<script>
const R=s=>s.replace(/([一-鿿々ヶ]+)\{([^}]+)\}/g,'<ruby>$1<rt>$2</rt></ruby>');
const F=t=>`<span class="chip f">${R('史実{しじつ}')}</span>${R(t)}`;
const A=t=>`<span class="chip a">${R('アプリの工夫{くふう}')}</span>${R(t)}`;
const app=document.getElementById('app');
let S={view:'title',school:null,step:0,done:{},shi:'',notes:{},marks:[]};
S.me=null;S.at='edo';S.met={};S.vis={};S.days={};S.ev={};
try{const d=JSON.parse(localStorage.getItem('manabitabi')||'{}');S.done=d.done||{};S.shi=d.shi||'';S.me=d.me||null;S.at=d.at||'edo';S.met=d.met||{};S.vis=d.vis||{};S.days=d.days||{};S.ev=d.ev||{};S.dailyDone=d.dd||'';S.opSeen=d.op||0;S.endSeen=d.ed||0;Object.keys(S.done).forEach(k=>{if(!S.vis[k])S.vis[k]=1})}catch(e){}
const save=()=>{try{localStorage.setItem('manabitabi',JSON.stringify({done:S.done,shi:S.shi,me:S.me,at:S.at,met:S.met,vis:S.vis,days:S.days,ev:S.ev,dd:S.dailyDone,op:S.opSeen,ed:S.endSeen}))}catch(e){}};
const UM={b:'武士{ぶし}の子{こ}',c:'商人{しょうにん}の子{こ}',n:'農家{のうか}の子{こ}',i:'医者{いしゃ}の子{こ}'};
const UMD={b:'藩{はん}の学校{がっこう}に通{かよ}える家{いえ}。父{ちち}は刀{かたな}を二本{にほん}さしている。',c:'町{まち}の寺子屋{てらこや}で、読{よ}み書{か}きとそろばんを習{なら}った。',n:'村{むら}の寺子屋{てらこや}で学{まな}び、家{いえ}の田畑{たはた}も手{て}つだっている。',i:'家{いえ}には薬{くすり}と本{ほん}がある。蘭学{らんがく}にあこがれている。'};
const AGE={10:'十歳{じっさい}',11:'十一歳{じゅういっさい}',12:'十二歳{じゅうにさい}',13:'十三歳{じゅうさんさい}',14:'十四歳{じゅうよんさい}',15:'十五歳{じゅうごさい}'};
const meLine=()=>`${esc(S.me.name)} ・ ${R(UM[S.me.um])} ・ ${R(AGE[S.me.age])}`;
/* だれが学べたか(史実) o: all=身分を問わない / b=武士だけ / most=多くは武士 */
const ADM={nisshin:{w:'会津藩{あいづはん}の上級{じょうきゅう}の武士{ぶし}の子{こ}。十歳{じっさい}で入学{にゅうがく}',o:'b'},kodo:{w:'水戸藩{みとはん}の武士{ぶし}とその子{こ}',o:'b'},shohei:{w:'幕府{ばくふ}の家来{けらい}とその子{こ}。講義{こうぎ}を聞{き}くだけなら、ほかの人{ひと}にもゆるされた',o:'most'},fuku:{w:'はじめは藩{はん}の武士{ぶし}の若者{わかもの}が中心{ちゅうしん}',o:'most'},teki:{w:'全国{ぜんこく}から集{あつ}まった若者{わかもの}',o:'open'},shizu:{w:'武士{ぶし}でない家{いえ}の子{こ}も学{まな}べた',o:'all'},shoka:{w:'武士{ぶし}の子{こ}も、そうでない家{いえ}の子{こ}も',o:'all'},kangi:{w:'年{とし}も身分{みぶん}も問{と}わない',o:'all'},kaigun:{w:'幕府{ばくふ}や藩{はん}からえらばれた武士{ぶし}の若者{わかもの}',o:'b'},goju:{w:'薩摩藩{さつまはん}の武士{ぶし}の男{おとこ}の子{こ}。六歳{ろくさい}から',o:'b'}};
const ERA={nisshin:'一八六〇年{ねん}ごろ',kodo:'一八四〇年代{ねんだい}',shohei:'一八五〇年代{ねんだい}',fuku:'一八六〇年代{ねんだい}',teki:'一八五〇年代{ねんだい}',shizu:'一八四〇年代{ねんだい}',shoka:'一八五七年{ねん}ごろ',kangi:'一八四〇年代{ねんだい}',kaigun:'一八五〇年代{ねんだい}のおわり',goju:'一八四〇年代{ねんだい}'};
function nyumon(){const a=ADM[S.school],b=S.me.um==='b';
  const v=a.o==='open'?F('全国{ぜんこく}から入門者{にゅうもんしゃ}が集{あつ}まりました。')+A('きみも塾生{じゅくせい}としてむかえます。'):a.o==='all'?F('きみの生{う}まれでも、ほんとうに入門{にゅうもん}できました。'):a.o==='most'?F('塾生{じゅくせい}の多{おお}くは武士{ぶし}の若者{わかもの}でした。')+A('きみも塾生{じゅくせい}としてむかえます。'):b?A('きみを、ここの武士{ぶし}の子{こ}としてむかえます。'):F('きみの生{う}まれでは、ほんとうは入門{にゅうもん}できませんでした。')+A('今日{きょう}は特別{とくべつ}に門{もん}をあけてもらいます。');
  return `<div class="nfuda"><b class="t">${R('入門札{にゅうもんふだ}')}</b>${meLine()}<br>${A('たずねる時代{じだい}:'+ERA[S.school]+'。学{まな}び舎{や}ごとに、出会{であ}う人{ひと}がいた時代{じだい}へ旅{たび}します。')}<br>${F('ここで学{まな}べた人{ひと}:'+a.w)}<br>${v}</div>`}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 音: 音楽と効果音(すべてその場で合成) ---------- */
const AU={on:true,ctx:null,mood:null,timer:null,step:0,next:0};
try{AU.on=localStorage.getItem('manabitabi_snd')!=='off'}catch(e){}
function ac(){if(!AU.ctx){const C=window.AudioContext||window.webkitAudioContext;AU.ctx=new C();AU.bgm=AU.ctx.createGain();AU.bgm.gain.value=.13;AU.bgm.connect(AU.ctx.destination);AU.sfx=AU.ctx.createGain();AU.sfx.gain.value=.55;AU.sfx.connect(AU.ctx.destination)}
  if(AU.ctx.state==='suspended')AU.ctx.resume();return AU.ctx}
function env(g,t,v,d,a=.006){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+d)}
function pluck(f,t,d,v,out){const c=AU.ctx,g=c.createGain();env(g,t,v,d);g.connect(out);[['triangle',1,1],['sine',2,.35],['sine',3.01,.12]].forEach(([w,m,k])=>{const o=c.createOscillator(),h=c.createGain();o.type=w;o.frequency.value=f*m;h.gain.value=k;o.connect(h).connect(g);o.start(t);o.stop(t+d+.05)})}
function flute(f,t,d,v,out){const c=AU.ctx,o=c.createOscillator(),g=c.createGain(),l=c.createOscillator(),lg=c.createGain();o.type='sine';o.frequency.value=f;l.frequency.value=5;lg.gain.value=f*.012;l.connect(lg).connect(o.frequency);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.12);g.gain.setValueAtTime(v,t+d*.7);g.gain.linearRampToValueAtTime(.0001,t+d);o.connect(g).connect(out);o.start(t);l.start(t);o.stop(t+d+.05);l.stop(t+d+.05)}
function drum(t,v,out,f=120){const c=AU.ctx,o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(42,t+.2);env(g,t,v,.3,.004);o.connect(g).connect(out);o.start(t);o.stop(t+.35)}
function hiss(t,d,v,out,fq=1800){const c=AU.ctx,n=c.createBufferSource(),b=c.createBuffer(1,c.sampleRate*d,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;n.buffer=b;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=fq;const g=c.createGain();env(g,t,v,d,.004);n.connect(f).connect(g).connect(out);n.start(t)}
function tok(f=520,d=.09){if(!AU.on)return;try{const c=ac();pluck(f,c.currentTime,Math.max(d,.12)*2,.5,AU.sfx)}catch(e){}}
function sfx(k){if(!AU.on)return;try{const c=ac(),t=c.currentTime,o=AU.sfx;
  if(k==='ok'){pluck(587,t,.5,.4,o);pluck(880,t+.11,.7,.4,o)}
  else if(k==='clack'){hiss(t,.05,.5,o,2600);pluck(1400,t,.06,.18,o)}
  else if(k==='stamp'){drum(t,.9,o,150);hiss(t,.12,.35,o,700);pluck(294,t+.18,1.2,.35,o);pluck(440,t+.3,1.2,.3,o);pluck(587,t+.42,1.6,.3,o)}
  else if(k==='arrive'){[294,392,440,587,784].forEach((f,i)=>pluck(f,t+i*.1,.9,.35,o));drum(t+.5,.6,o)}
  else if(k==='boom'){drum(t,1,o,70);hiss(t,.6,.5,o,200)}
  else if(k==='step'){hiss(t,.06,.22,o,900)}}catch(e){}}
/* 音楽: 和楽器風の音色 × ビート。都節(in)と民謡調のペンタ(yo)。数字は音階の何番目か、_ は休み */
const SC={in:[0,1,5,7,8],yo:[0,3,5,7,10]},_=-1;
function fxInit(){if(AU.bus)return;const c=AU.ctx;AU.bus=c.createGain();const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=6000;const cp=c.createDynamicsCompressor();cp.threshold.value=-18;cp.ratio.value=4;
  AU.bus.connect(lp).connect(cp).connect(AU.bgm);AU.send=c.createGain();AU.send.gain.value=.3;const dl=c.createDelay(1);dl.delayTime.value=.33;const fb=c.createGain();fb.gain.value=.38;const dlp=c.createBiquadFilter();dlp.type='lowpass';dlp.frequency.value=2200;
  AU.send.connect(dl);dl.connect(dlp).connect(fb).connect(dl);dlp.connect(AU.bus);AU.dl=dl;AU.bgm.gain.value=.22}
function sham(f,t,v,out){const c=AU.ctx,o=c.createOscillator(),bp=c.createBiquadFilter(),g=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(f*1.03,t);o.frequency.exponentialRampToValueAtTime(f,t+.03);bp.type='bandpass';bp.frequency.value=Math.min(4200,f*3.2);bp.Q.value=1.6;env(g,t,v,.26,.003);o.connect(bp).connect(g).connect(out);o.start(t);o.stop(t+.3);hiss(t,.02,v*.5,out,3200)}
function bassN(f,t,d,v,out){const c=AU.ctx,o=c.createOscillator(),o2=c.createOscillator(),lp=c.createBiquadFilter(),g=c.createGain();o.type='triangle';o2.type='sine';o.frequency.value=f;o2.frequency.value=f/2;lp.type='lowpass';lp.frequency.value=420;env(g,t,v,d,.008);o.connect(lp);o2.connect(lp);lp.connect(g).connect(out);o.start(t);o2.start(t);o.stop(t+d+.05);o2.stop(t+d+.05)}
function pad(fs,t,d,v,out){const c=AU.ctx,lp=c.createBiquadFilter(),g=c.createGain();lp.type='lowpass';lp.frequency.value=780;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+d*.35);g.gain.linearRampToValueAtTime(.0001,t+d);lp.connect(g).connect(out);
  fs.forEach(f=>[-7,7].forEach(ct=>{const o=c.createOscillator();o.type='sawtooth';o.frequency.value=f;o.detune.value=ct;o.connect(lp);o.start(t);o.stop(t+d+.05)}))}
const snare=(t,v,o)=>{hiss(t,.15,v,o,1900);drum(t,v*.5,o,210)},hat=(t,v,o)=>hiss(t,.03,v,o,8200);
const MOOD={
 map:{bpm:82,sc:'in',base:146.83,sw:.16,k:'x.....x...x.....',s:'....x.......x...',h:'x.x.x.x.x.x.x.xx',br:'x..x..x...x.....',bb:[0,3,2,4],pad:1,ins:'koto',
  ld:[[5,_,_,7,_,_,8,_,7,_,5,_,_,_,_,_, 4,_,_,5,_,_,7,_,5,_,4,_,2,_,_,_, 5,_,_,7,_,_,9,_,8,_,7,_,_,_,5,_, 4,_,5,_,2,_,_,_,0,_,_,_,_,_,_,_],
      [9,_,_,8,_,_,7,_,_,_,5,_,7,_,_,_, 8,_,_,7,_,_,5,_,4,_,_,_,2,_,_,_, 4,_,5,_,7,_,_,_,5,_,4,_,2,_,_,_, 0,_,_,2,_,_,4,_,5,_,_,_,_,_,_,_]]},
 walk:{bpm:138,sc:'yo',base:146.83,sw:0,k:'x...x...x...x.x.',s:'....x.......x..x',h:'x.xxx.xxx.xxx.xx',br:'x.x.x.x.x.x.x.x.',bb:[0,0,3,4],pad:0,ins:'sham',
  ld:[[5,_,5,7,8,_,7,5,7,_,5,4,5,_,_,_, 5,_,5,7,8,_,10,8,7,_,8,7,5,_,_,_],[5,_,5,7,8,_,7,5,7,_,5,4,5,_,_,_, 8,_,8,10,12,_,10,8,7,_,5,7,8,_,_,_],
      [9,_,8,7,8,_,7,5,7,_,5,4,2,_,4,_, 5,_,7,_,8,_,7,5,4,_,2,_,0,_,_,_],[5,_,5,7,8,_,7,5,7,_,5,4,5,_,_,_, 5,7,8,10,12,_,10,_,8,_,7,_,5,_,_,_]]},
 school:{bpm:72,sc:'yo',base:146.83,sw:0,k:'x...............',s:'................',h:'....x.......x...',br:'x.........x.....',bb:[0,2,3,0],pad:1,ins:'koto',
  ld:[[5,_,_,_,_,_,7,_,_,_,8,_,_,_,_,_, _,_,7,_,_,_,5,_,_,_,_,_,4,_,_,_, 5,_,_,_,_,_,9,_,_,_,8,_,_,_,7,_, _,_,5,_,_,_,_,_,4,_,_,_,5,_,_,_]]},
 night:{bpm:68,sc:'in',base:130.81,sw:.14,k:'x.......x.x.....',s:'....x.......x...',h:'..x...x...x...x.',br:'x.....x...x.....',bb:[0,0,1,4],pad:1,ins:'flute',
  ld:[[7,_,_,_,_,_,_,_,6,_,_,_,5,_,_,_, _,_,_,_,4,_,_,_,5,_,_,_,_,_,_,_, 9,_,_,_,_,_,_,_,8,_,_,_,7,_,_,_, 5,_,_,_,_,_,6,_,5,_,_,_,_,_,_,_]]}};
const nf=(m,d)=>{const sc=SC[m.sc],o=Math.floor(d/5);return m.base*Math.pow(2,(sc[((d%5)+5)%5]+12*o)/12)};
function bgmTick(){const c=AU.ctx,m=MOOD[AU.mood];if(!m)return;fxInit();const st=15/m.bpm,B=AU.bus;AU.dl.delayTime.value=st*3;
  while(AU.next<c.currentTime+.25){const i=AU.step,pos=i%16,bar=Math.floor(i/16),t=Math.max(AU.next,c.currentTime+.02)+(pos%2?st*m.sw:0);
    if(m.k[pos]==='x')drum(t,.95,B,150);if(m.s[pos]==='x')snare(t,.5,B);if(m.h[pos]==='x')hat(t,pos%4===2?.22:.13,B);
    const root=m.bb[bar%m.bb.length];if(m.br[pos]==='x')bassN(nf(m,root)/2,t,st*2.6,.75,B);
    if(m.pad&&pos===0)pad([nf(m,root),nf(m,root+2),nf(m,root+4)],t,st*16,.11,B);
    const L=m.ld[0].length,pat=m.ld[Math.floor(i/L)%m.ld.length],n=pat[i%L];
    if(n>=0){const f=nf(m,n)*2;if(m.ins==='sham'){sham(f,t,.5,B);sham(f,t,.12,AU.send)}else if(m.ins==='flute'){let k=1;while(pat[(i+k)%L]<0&&k<12)k++;flute(f,t,st*k*.95,.3,B);flute(f,t,st*k*.9,.1,AU.send)}else{pluck(f,t,1.5,.5,B);pluck(f,t,1.2,.2,AU.send)}}
    AU.step++;AU.next+=st}}
function bgm(){clearInterval(AU.timer);AU.timer=null;if(!AU.on||!AU.mood||!AU.ctx)return;AU.step=0;AU.next=AU.ctx.currentTime+.1;AU.timer=setInterval(()=>{try{bgmTick()}catch(e){}},90)}
function setMood(m){if(AU.mood===m&&AU.timer)return;AU.mood=m;bgm()}
const sndBtn=document.getElementById('snd'),sndLabel=()=>{sndBtn.textContent=AU.on?'♪ 音あり':'♪ 音なし';sndBtn.setAttribute('aria-pressed',AU.on)};sndLabel();
sndBtn.onclick=()=>{AU.on=!AU.on;try{localStorage.setItem('manabitabi_snd',AU.on?'on':'off')}catch(e){}sndLabel();if(AU.on){try{ac()}catch(e){}}bgm()};
addEventListener('pointerdown',e=>{if(!AU.on)return;try{ac();if(!AU.timer)bgm()}catch(x){}if(e.target.closest&&e.target.closest('.btn,.fuda,.choice button,.ages button,.datsu button,#tabs button'))sfx('clack')},true);

const hav=(a,b)=>{const r=x=>x*Math.PI/180,dl=r(b[0]-a[0]),dg=r(b[1]-a[1]),h=Math.sin(dl/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dg/2)**2;return 12742*Math.asin(Math.sqrt(h))};

function viewWalk(){

  app.innerHTML=`<button class="btn sub" id="back">← ${R('道中図{どうちゅうず}へ')}</button>
  <section class="panel"><h2>${R(plName(S.at))} → ${R(to.pl)}</h2>
  <p>${near?R('同{おな}じ江戸{えど}の町{まち}の中{なか}。歩{ある}いてすぐだ。'):R(`およそ${ri}里{り}。歩{ある}いて${days}日{にち}ほどの旅{たび}になる。`)}</p>
  <canvas id="cv" class="cv" role="img" aria-label="街道を歩く旅人"></canvas><p id="st" class="kyu"></p><p id="tip" style="min-height:4em;font-size:15px"></p>
  <div class="row" id="ctl"><button class="btn" id="go">${R('歩{ある}く(おしつづける)')}</button><button class="btn sub" id="skip">${R('ひとっとび')}</button></div>
  <p class="note">${A('道{みち}のりは地図{ちず}の上{うえ}でまっすぐ測{はか}ったおおよその数{かず}です。ほんとうの街道{かいどう}はもっと長{なが}く、海{うみ}は舟{ふね}でわたりました。')}</p></section>`;
  const cv=app.querySelector('#cv'),g=cv.getContext('2d'),tk=++WK,st=app.querySelector('#st'),tip=app.querySelector('#tip'),go=app.querySelector('#go');
  let p=0,walking=false,last=performance.now(),arrived=false,stride=0,W=0,Hh=0,tipN=-1;
  const size=()=>{const d=window.devicePixelRatio||1;W=cv.clientWidth||320;Hh=cv.clientHeight||250;cv.width=W*d;cv.height=Hh*d;g.setTransform(d,0,0,d,0,0)};size();

  go.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();on()}};go.onkeyup=off;go.onblur=off;

  function draw(t){
    const sc=p*total,cyc=near?0:Math.min(days,3),ph=(p*cyc)%1,b=cyc?.5+.5*Math.cos(ph*6.283):1,gy=Hh*.74;
    const sky=g.createLinearGradient(0,0,0,gy);sky.addColorStop(0,mix([23,48,79],[70,116,160],b));sky.addColorStop(1,mix([70,84,112],[239,230,208],b));g.fillStyle=sky;g.fillRect(0,0,W,gy);
    g.fillStyle=b>.45?'#c0391f':'#f1ecdd';g.beginPath();g.arc(W*(.2+.6*((ph+.5)%1)),Hh*(.4-.24*b),13,0,7);g.fill();

    hill(.12,26,Hh*.5,mix([36,52,78],[108,134,160],b));hill(.35,16,Hh*.62,mix([30,48,44],[74,104,82],b));
    g.fillStyle=mix([92,86,68],[203,191,156],b);g.fillRect(0,gy,W,Hh-gy);g.fillStyle=mix([78,72,56],[179,164,127],b);g.fillRect(0,Hh*.82,W,Hh*.1);
    for(let x=-((sc*.8)%240)-30;x<W+60;x+=240){g.fillStyle='#3a2a1c';g.fillRect(x+8,gy-34,5,38);g.fillStyle=mix([20,40,30],[47,82,58],b);for(let i=0;i<3;i++){g.beginPath();g.moveTo(x-12+i*3,gy-22-i*16);g.lineTo(x+32-i*3,gy-22-i*16);g.lineTo(x+10,gy-44-i*16);g.fill()}}
    for(let x=-((sc)%900)+700;x<W+80;x+=900){g.fillStyle=mix([40,52,40],[98,122,86],b);g.beginPath();g.arc(x,Hh*.82,24,Math.PI,0);g.fill()}

      g.strokeStyle='#c0391f';g.lineWidth=3;g.beginPath();g.arc(gx+35,Hh*.82-104,16,0,7);g.stroke();g.fillStyle='#c0391f';g.font='20px "Dela Gothic One",sans-serif';g.textAlign='center';g.fillText(to.seal,gx+35,Hh*.82-97)}
    const x=W*.28,y=Hh*.88,s=walking&&p<1?Math.sin(t/95):0;g.strokeStyle='#1c1a17';g.fillStyle='#1c1a17';g.lineWidth=4;g.lineCap='round';
    g.beginPath();g.moveTo(x,y-26);g.lineTo(x-9*s,y);g.moveTo(x,y-26);g.lineTo(x+9*s,y);g.moveTo(x,y-26);g.lineTo(x,y-50);g.moveTo(x,y-44);g.lineTo(x+12,y-34+3*s);g.stroke();
    g.lineWidth=2;g.beginPath();g.moveTo(x+13,y-52+3*s);g.lineTo(x+13,y);g.stroke();
    g.fillStyle='#8f5527';g.fillRect(x-13,y-50,9,14);g.fillStyle='#1c1a17';g.beginPath();g.arc(x,y-56,6,0,7);g.fill();g.fillStyle='#cdb98a';g.beginPath();g.moveTo(x-16,y-58);g.lineTo(x+16,y-58);g.lineTo(x,y-70);g.fill();
    if(id==='nisshin'&&p>.55){g.fillStyle='#fff';for(let i=0;i<40;i++)g.fillRect((i*83+t*.03*(1+i%3))%W,(i*47+t*.05*(1+i%4))%gy,2,2)}
    if(b<1){g.fillStyle=`rgba(13,20,40,${(1-b)*.4})`;g.fillRect(0,0,W,Hh)}
  }
  function tick(t){if(tk!==WK||!cv.isConnected)return;const dt=Math.min(.1,(t-last)/1000);last=t;

function orderGame(box,parts,done){
  let next=0,miss=0;const idx=parts.map((_,i)=>i);
  do{idx.sort(()=>Math.random()-.5)}while(parts.length>1&&idx.every((v,i)=>v===i));
  box.innerHTML=`<div class="ans"></div><div class="tiles">${idx.map(i=>`<button class="tile" data-i="${i}">${R(parts[i])}</button>`).join('')}</div>`;
  const ans=box.querySelector('.ans');
  box.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{
    if(+t.dataset.i===next){tok(440+next*60);ans.insertAdjacentHTML('beforeend',`<span>${R(parts[next])}</span>`);t.classList.add('used');next++;if(next===parts.length)done(miss)}
    else{miss++;tok(160,.15);t.classList.remove('ng');void t.offsetWidth;t.classList.add('ng')}
  });
}

  const go=()=>{const it=items[i];frame(sc,`${H(title)} ${i+1}/${items.length}<p>${R(lead)}</p>${it.s?`<p style="font-size:14px">${R(it.s)}</p>`:''}<div id="og"></div><p id="im" hidden>${R('意味{いみ}:'+it.m)}</p><button class="btn" id="nq" hidden>${R('つぎの文{ぶん}')}</button><p class="note">${note}<br>${A('通{かよ}うたびに、読{よ}む文{ぶん}がかわります。')}</p>`,tot,false);
    orderGame(app.querySelector('#og'),it.p,()=>{app.querySelector('#im').hidden=false;if(++i<items.length){const n=app.querySelector('#nq');n.hidden=false;n.onclick=()=>{go();scrollTo(0,0)}}else unlock()})};go()};
const fin=(sc,seal,title,who,src,tot,pre='')=>()=>{frame(sc,pre+finish(seal,title,who,src),tot,false);bindHome()};
/* 正解のある問いを順に出す */
const quizStep=(sc,title,qs,note,tot)=>()=>{const QS=typeof qs==='function'?qs():qs;let i=0;const go=()=>{const q=QS[i];
  frame(sc,`${H(title)} ${q.head||''}<p>${R(q.q)}</p><div class="choice">${q.o.map((o,k)=>`<button data-k="${k}">${R(o)}</button>`).join('')}</div><p id="ex" hidden>${R(q.x)}</p><button class="btn" id="nq" hidden>${R('つぎの問{と}い')}</button><p class="note">${note}</p>`,tot,false);
  app.querySelectorAll('.choice button').forEach(b=>b.onclick=()=>{if(+b.dataset.k===q.a){tok(620);b.classList.add('sel');app.querySelectorAll('.choice button').forEach(x=>x.disabled=true);app.querySelector('#ex').hidden=false;
    if(++i<QS.length){const n=app.querySelector('#nq');n.hidden=false;n.onclick=go}else unlock()}else{tok(160,.15);b.classList.remove('ng');void b.offsetWidth;b.classList.add('ng')}})};go()};
/* 正解のない問い */
const choiceStep=(sc,title,q,opts,after,note,tot,snd)=>()=>{const al=ALTQ[S.school+':'+plain(title)],v=S.vis[S.school]||0,X=al&&v?al[(v-1)%al.length]:{q,o:opts,a:after};frame(sc,`${H(title)}<p>${R(X.q)}</p><div class="choice">${X.o.map(o=>`<button>${R(o)}</button>`).join('')}</div><p id="ex" hidden>${R(X.a)}</p><p class="note">${note}</p>`,tot,false);
  if(snd)setTimeout(()=>sfx('boom'),400);
  app.querySelectorAll('.choice button').forEach(b=>b.onclick=()=>{app.querySelectorAll('.choice button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');tok();app.querySelector('#ex').hidden=false;unlock()})};

  {q:'船{ふね}は一時間{いちじかん}に六海里{ろくかいり}すすむ。三時間{さんじかん}では?',o:['十二海里{じゅうにかいり}','十八海里{じゅうはちかいり}','二十四海里{にじゅうよんかいり}'],a:1,x:'6×3=18。速{はや}さと時間{じかん}から、今{いま}いる場所{ばしょ}がわかる。'},
  {q:'羅針盤{らしんばん}は北{きた}が0度{ど}、東{ひがし}が90度{ど}、南{みなみ}が180度{ど}。南東{なんとう}へ向{む}かうには?',o:['45度{ど}','135度{ど}','225度{ど}'],a:1,x:'東{ひがし}と南{みなみ}のまん中{なか}だから、90と180の間{あいだ}の135度{ど}。'},
  {q:'正午{しょうご}、太陽{たいよう}がいちばん高{たか}くなった。日本{にほん}の近{ちか}くの海{うみ}で、太陽{たいよう}はどの方角{ほうがく}にある?',o:['北{きた}','東{ひがし}','南{みなみ}'],a:2,x:'南{みなみ}。このときの太陽{たいよう}の高{たか}さをはかると、船{ふね}が南北{なんぼく}のどのあたりにいるかがわかる。'}],
  F('海{うみ}の上{うえ}には道{みち}しるべがありません。伝習生{でんしゅうせい}は西洋{せいよう}の算術{さんじゅつ}を一{いち}から学{まな}びました。')+'<br>'+A('問題{もんだい}は小学生{しょうがくせい}むけに作{つく}ったものです。'),3),
 fin(kaiSc,'海','海軍伝習所{かいぐんでんしゅうじょ} 修了{しゅうりょう}','ここで学{まな}んだ勝海舟{かつかいしゅう}は、一八六〇年{ねん}に咸臨丸{かんりんまる}で太平洋{たいへいよう}をわたり、アメリカへ行{い}きました。','カッテンディーケ『長崎海軍伝習所{ながさきかいぐんでんしゅうじょ}の日々{ひび}』',3)
];

/* ---------- 郷中教育 ---------- */
const gojuSc='<div class="kemuri"></div><div class="yama"></div><div class="where">薩摩・桜島の見える町</div>';
const GOJU=[
 intro(gojuSc,'薩摩{さつま}の城下{じょうか}。この町{まち}では、年上{としうえ}の「二才{にせ}」が、年下{としした}の「稚児{ちご}」に教{おし}える。きみは今日{きょう}、稚児{ちご}として仲間{なかま}に入{はい}る。',
  F('「郷中{ごじゅう}」は町{まち}ごとの集{あつ}まり。武士{ぶし}の男{おとこ}の子{こ}は六歳{ろくさい}から入{はい}り、先輩{せんぱい}が後輩{こうはい}を教{おし}えました。'),5),
 sodoku(gojuSc,'いろは歌{うた}','みんなでおぼえる最初{さいしょ}の歌{うた}。読{よ}む順{じゅん}におそう。',['いにしへの','道{みち}を聞{き}きても','唱{とな}へても','わが行{おこな}ひに','せずばかひなし'],'意味{いみ}:昔{むかし}のりっぱな教{おし}えを聞{き}いても口{くち}にしても、自分{じぶん}でやらなければ意味{いみ}がない。',
  F('島津忠良{しまづただよし}(日新公{じっしんこう})が作{つく}った四十七首{よんじゅうななしゅ}の「いろは歌{うた}」の、はじめの一首{いっしゅ}です。'),5),
 choiceStep(gojuSc,'二才{にせ}の問{と}い','二才{にせ}がたずねる。「友{とも}だちと会{あ}う約束{やくそく}の日{ひ}。大雨{おおあめ}で橋{はし}が流{なが}された。どうする?」',['遠回{とおまわ}りしてでも行{い}く','川{かわ}がおさまるまで待{ま}つ','行{い}けないと知{し}らせる方法{ほうほう}をさがす'],
  '二才{にせ}はすぐに重{かさ}ねてたずねる。「では、そうしているうちに日{ひ}がくれたら?」 声{こえ}に出{だ}して、すぐ答{こた}えてみよう。',F('郷中{ごじゅう}では、先輩{せんぱい}が後輩{こうはい}を教{おし}えみちびきました。')+'<br>'+A('問{と}いかけの場面{ばめん}は作{つく}ったものです。正{ただ}しい答{こた}えはありません。'),5),
 choiceStep(gojuSc,'二才{にせ}になる','年月{としつき}がたち、きみは二才{にせ}になった。稚児{ちご}がけんかに負{ま}けて泣{な}いている。なんと声{こえ}をかける?',['いっしょにけいこしよう','なぜ負{ま}けたか、考{かんが}えてみよう','泣{な}いてもいい。つぎは負{ま}けるな'],
  '教{おし}えられた子{こ}が、こんどは教{おし}える。郷中{ごじゅう}の学{まな}びは、こうして受{う}けつがれた。',F('郷中{ごじゅう}の教{おし}えは「負{ま}けるな、うそを言{い}うな、弱{よわ}い者{もの}をいじめるな」。')+'<br>'+A('声{こえ}かけは、どれをえらんでもかまいません。'),5),
 fin(gojuSc,'薩','郷中教育{ごじゅうきょういく} 修了{しゅうりょう}','西郷隆盛{さいごうたかもり}と大久保利通{おおくぼとしみち}は、同{おな}じ町{まち}の郷中{ごじゅう}で育{そだ}ちました。','島津忠良{しまづただよし}「日新公{じっしんこう}いろは歌{うた}」',5)
];
const SCHOOLS={nisshin:NISSHIN,teki:TEKI,shoka:SHOKA,kodo:KODO,shohei:SHOHEI,fuku:FUKU,shizu:SHIZU,kangi:KANGI,kaigun:KAIGUN,goju:GOJU};

function render(){
  const tabs=document.getElementById('tabs'),tabbed=!!S.me&&!['title','make','op','end'].includes(S.view);tabs.hidden=!tabbed;document.body.classList.toggle('tabbed',tabbed);
  tabs.querySelectorAll('button').forEach(b=>b.classList.toggle('on',(b.dataset.v==='pass')===(S.view==='pass')));
  setMood(S.view==='walk'?'walk':S.view==='school'?(S.school==='teki'?'night':'school'):'map');
  if(S.view==='title')return viewTitle();
  if(S.view==='op')return slides(OP(),()=>{S.opSeen=1;save();S.view=S.me?'map':'make';render();scrollTo(0,0)});
  if(S.view==='end'&&S.me)return slides(ED(),()=>{S.endSeen=1;save();S.view='pass';render();scrollTo(0,0)});
  if(!S.me||S.view==='make')return viewMake();
  if(S.view==='school'){document.body.dataset.s=S.school;SCHOOLS[S.school][S.step]()}
  else if(S.view==='walk')viewWalk();
  else if(S.view==='src')viewSrc();
  else if(S.view==='pass')viewPass(); else viewMap();
}
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b||S.view===b.dataset.v)return;clearTimeout(T);WK++;try{speechSynthesis.cancel()}catch(x){}
  S.resume=S.view==='school'&&b.dataset.v==='pass'?{school:S.school,step:S.step}:b.dataset.v==='map'?null:S.resume;S.view=b.dataset.v;render();scrollTo(0,0)};
const start=d=>{if(d&&d.done){S.done=d.done;S.shi=d.shi||'';S.me=d.me||S.me;S.at=d.at||S.at}render()};
window.claude?.hot?.snapshot?.(()=>({done:S.done,shi:S.shi,me:S.me,at:S.at}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
